<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSGym - אתר תרגול מדעי המחשב</title>
<style>
  :root { --bg: #f4f6f9; --card: #fff; --fg: #1f2937; --muted: #6b7280; --line: #d9dee6; --accent: #0f766e; --accent-soft: #e3f3f1; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: "Segoe UI", Arial, Helvetica, sans-serif; font-size: 17px; line-height: 1.5; }
  header { background: var(--accent); color: #fff; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header .ver { font-size: 13px; opacity: .85; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  .intro { color: var(--muted); margin: 4px 0 16px; }
  .topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px;
          color: inherit; text-decoration: none; transition: border-color .15s, box-shadow .15s; }
  .card:hover, .card:focus-visible { border-color: var(--accent); box-shadow: 0 2px 10px rgba(15, 118, 110, .14); outline: none; }
  .card h2 { margin: 0 0 6px; font-size: 18px; color: var(--accent); }
  .card p { margin: 0; color: var(--muted); font-size: 15px; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 18px 16px 24px; }
  [dir=ltr] { unicode-bidi: isolate; }
</style>
</head>
<body>
<header>
  <h1>CSGym - אתר תרגול מדעי המחשב</h1>
  <span class="ver" dir="ltr" id="ver"></span>
</header>

<main>
  <p class="intro">בחרו נושא לתרגול:</p>

  <!-- נושא חדש: מעתיקים כרטיס אחד ומשנים כותרת, תיאור וקישור (תיקייה/index.html) -->
  <nav class="topics" aria-label="נושאים">
    <a class="card" href="recursion/index.html">
      <h2>תרגול פעולות רקורסיביות</h2>
      <p>מעקב אחר פעולות רקורסיביות ב-C#: מה תחזיר הפעולה, מה יודפס וכמה קריאות יהיו. מספרים, מחרוזות ומערכים, ב-5 רמות קושי.</p>
    </a>
  </nav>
</main>

<footer>נוצר על ידי ראשון דיבקר בעזרת Claude · <span dir="ltr" id="ver2"></span></footer>

<script>
  // גרסת האתר. חייבת להיות זהה ל-VERSION בכל מודול (נבדק ב-recursion/tests.html)
  const VERSION = 'v0.2';
  document.getElementById('ver').textContent = VERSION;
  document.getElementById('ver2').textContent = VERSION;
</script>
</body>
</html>
